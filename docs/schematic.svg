<text x="40" y="604" font-size="12">Pin 9 to +9V = bar mode (leave open for dot mode).</text>
<text x="40" y="622" font-size="12">Pin 8 to GND with R1 from Pin 7 to Pin 8: full scale = 1.25 V, LED current = 12.5 / R1 = about 8.7 mA. No LED resistors needed.</text>
<text x="40" y="640" font-size="12">D1: striped end (cathode) toward Pin 5. Jack RING (right channel) is unused. All GND symbols are the same net.</text>
<text x="40" y="658" font-size="12">Optional low-pass filter, Schottky diode and sensitivity tweaks: see docs/filters-and-tuning.md</text>
</svg>